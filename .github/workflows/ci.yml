name: Node CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      env:
        CI: true
    
    - name: Build
      run: yarn build
      env:
        CI: true
    
    - name: Test
      run: yarn test --passWithNoTests
      env:
        CI: true
